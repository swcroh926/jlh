<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5fc">
  <title>키득 · 아이디어를 작품으로</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>
        <span class="brand-name">키득</span>
        <span class="brand-caption">아이디어를 작품으로</span>
      </span>
    </a>
    <nav id="nav" aria-label="프로젝트 메뉴">
      <button type="button" data-step="0">주제 입력</button>
      <button type="button" data-step="1">후보 비교·선택</button>
      <button type="button" data-step="2">실험 계획</button>
      <button type="button" data-step="3">실험 기록</button>
      <div class="search-menu">
        <button type="button" id="open-award-search">
          <span class="search-icon" aria-hidden="true"></span>
          비슷한 작품 찾아보기
        </button>
      </div>
    </nav>
  </aside>
  <main>
    <header class="workspace-header">
      <span>나의 탐구 프로젝트</span>
      <span id="save-status" role="status">이 브라우저에 자동 저장</span>
    </header>
    <section id="app" class="workspace-view"></section>
    <section id="award-search" class="workspace-view" hidden></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
